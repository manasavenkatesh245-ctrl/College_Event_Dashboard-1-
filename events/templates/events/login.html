<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .login-box {
            background: white;
            width: 380px;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.12);
        }

        .login-box h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .login-box p {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .login-box label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .login-box input {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }

        .login-button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .login-button:hover {
            background: #1d4ed8;
        }

        .error {
            color: red;
            text-align: center;
            margin-bottom: 15px;
        }

    </style>

</head>


<body>

    <div class="login-box">

        <h1>🎓 CampusEvents</h1>

        <p>Admin Login</p>


        {% if form.errors %}

        <div class="error">
            Invalid username or password.
        </div>

        {% endif %}


        <form method="post">

            {% csrf_token %}

            <label for="id_username">
                Username
            </label>

            <input
                type="text"
                name="username"
                id="id_username"
                required
            >


            <label for="id_password">
                Password
            </label>

            <input
                type="password"
                name="password"
                id="id_password"
                required
            >


            <button
                type="submit"
                class="login-button"
            >
                Login
            </button>

        </form>

    </div>

</body>

</html>
